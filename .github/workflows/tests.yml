name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light subset only: the reliability/frozen-split modules import numpy,
      # pandas, scikit-learn and joblib — no torch/fastapi needed to test them.
      - run: pip install numpy pandas scikit-learn joblib
      - run: python tests/test_reliability.py
